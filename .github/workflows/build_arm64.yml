# NOTE: This workflow targets old ARM64 Linux userspace compatibility for stock Anbernic ARC OS.
# Intent:
# - Build inside ubuntu:20.04 to keep a conservative host baseline.
# - Pull ARM64 target libs from Ubuntu Focal ports.
# - Avoid third_party caching until ABI baseline is fully validated.
# - Build SDL3 as Wayland-only (no KMSDRM/X11).
# - Package needed shared libs locally into dist/lib.
# - Hard fail CI if packaged binaries require GLIBC > 2.32.
# - Keep -static-libstdc++ -static-libgcc on the main executable.

name: Build (Linux ARM64 Cross-Compile)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install toolchain (amd64 host + arm64 sysroot from ports)
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # Force DEFAULT repos to amd64 only
          cat > /etc/apt/sources.list <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu focal-security main restricted universe multiverse
          EOF

          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources || true

          apt-get update

          # Base build deps (amd64 host tools)
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils bzip2 tar zip file \
            ninja-build make pkg-config \
            autoconf automake libtool gettext texinfo \
            clang \
            crossbuild-essential-arm64 \
            binutils \
            binutils-aarch64-linux-gnu

          # Host Wayland tools (amd64) for SDL3 protocol generation
          apt-get install -y --no-install-recommends \
            wayland-protocols \
            libwayland-bin \
            libwayland-dev

          # Enable arm64, but ONLY via ports.ubuntu.com
          dpkg --add-architecture arm64

          cat > /etc/apt/sources.list.d/arm64-ports.list <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse
          EOF

          apt-get update

      - name: Install newer CMake (host x86_64)
        shell: bash
        run: |
          set -euxo pipefail

          CMAKE_VER="3.30.5"
          ARCH="linux-x86_64"

          cd /tmp
          curl -L --retry 5 --retry-delay 2 \
            -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-${ARCH}.tar.gz"

          tar -xzf cmake.tar.gz
          mv "cmake-${CMAKE_VER}-${ARCH}" /opt/cmake

          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake
          ln -sf /opt/cmake/bin/ctest /usr/local/bin/ctest
          ln -sf /opt/cmake/bin/cpack /usr/local/bin/cpack

          which cmake
          cmake --version

      - name: Verify host tools
        shell: bash
        run: |
          set -euxo pipefail
          cmake --version
          ninja --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version
          aarch64-linux-gnu-pkg-config --version || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure GekkoNet is present (submodule or pinned clone)
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive || true
          git submodule update --init --recursive || true

          if [ ! -d "GekkoNet" ]; then
            echo "GekkoNet folder missing; cloning pinned HeatXD/GekkoNet commit..."
            git clone https://github.com/HeatXD/GekkoNet.git GekkoNet
            cd GekkoNet
            git checkout ad4b51644b408c2c3308384613a96dc38d7d4afd
            cd ..
          fi

          test -d GekkoNet
          test -f GekkoNet/CMakeLists.txt
          echo "GekkoNet OK"

      # IMPORTANT: cache disabled until ABI baseline is proven
      # - name: Cache third_party
      #   uses: actions/cache@v4
      #   with:
      #     path: third_party
      #     key: Linux-arm64-cross-${{ hashFiles('build-deps.sh', 'CMakeLists.txt', 'cmake/**', '.github/workflows/**') }}

      - name: Install ARM64 dev libs for SDL3 (from apt) - FOCAL ARM64
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update

          apt-get install -y --no-install-recommends \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libdrm-dev:arm64 \
            libgbm-dev:arm64 \
            libgl1-mesa-dev:arm64 \
            libgles2-mesa-dev:arm64 \
            libegl1-mesa-dev:arm64 \
            libdbus-1-dev:arm64 \
            libudev-dev:arm64 \
            libwayland-dev:arm64 \
            libwayland-egl1:arm64 \
            libwayland-client0:arm64 \
            libwayland-cursor0:arm64 \
            libwayland-server0:arm64 \
            libxkbcommon-dev:arm64 \
            wayland-protocols

          # Optional; may be unavailable on focal arm64
          apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev:arm64 \
            libdecor-0-dev:arm64 || true

      - name: Set pkg-config for cross (arm64)
        shell: bash
        run: |
          set -euxo pipefail
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config" >> "$GITHUB_ENV"

      - name: Prepare third_party folder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/third_party"

      - name: Build libcdio (aarch64)
        shell: bash
        run: |
          set -euxo pipefail
          TP="$GITHUB_WORKSPACE/third_party"
          PREFIX="$TP/libcdio/build"
          SRC="$TP/libcdio-src"
          VER="2.2.0"

          if [ -f "$PREFIX/include/cdio/iso9660.h" ] && [ -f "$PREFIX/lib/libcdio.a" ]; then
            echo "libcdio already built in $PREFIX"
            exit 0
          fi

          rm -rf "$SRC"
          mkdir -p "$SRC"
          cd "$SRC"

          curl -L --retry 5 --retry-delay 2 \
            -o "libcdio-${VER}.tar.gz" \
            "https://github.com/libcdio/libcdio/releases/download/${VER}/libcdio-${VER}.tar.gz"

          tar xzf "libcdio-${VER}.tar.gz"
          cd "libcdio-${VER}"

          ./configure \
            --host=aarch64-linux-gnu \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install

      - name: Build FFmpeg (aarch64)
        shell: bash
        run: |
          set -euxo pipefail
          TP="$GITHUB_WORKSPACE/third_party"
          cd "$TP"

          FFMPEG="ffmpeg-8.0"
          INSTALL="$TP/ffmpeg/build"

          if [ -f "$INSTALL/lib/libavcodec.so" ]; then
            echo "FFmpeg already built."
            exit 0
          fi

          mkdir -p ffmpeg
          cd ffmpeg

          if [ ! -d "$FFMPEG" ]; then
            curl -L -O "https://ffmpeg.org/releases/$FFMPEG.tar.xz"
            tar xf "$FFMPEG.tar.xz"
          fi

          cd "$FFMPEG"
          mkdir -p build
          cd build

          ../configure \
            --prefix="$INSTALL" \
            --arch=aarch64 \
            --target-os=linux \
            --enable-cross-compile \
            --cross-prefix=aarch64-linux-gnu- \
            --disable-x86asm \
            --disable-static \
            --enable-shared \
            --disable-all \
            --disable-autodetect \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swresample \
            --enable-decoder=adpcm_adx \
            --enable-parser=adx \
            --enable-muxer=adx

          make -j"$(nproc)"
          make install

      - name: Build SDL3 (aarch64) - Wayland only (no KMSDRM/X11)
        shell: bash
        run: |
          set -euxo pipefail
          TP="$GITHUB_WORKSPACE/third_party"
          cd "$TP"

          SDL="SDL3-3.2.24"
          INSTALL="$TP/sdl3/build"

          if [ -f "$INSTALL/lib/cmake/SDL3/SDL3Config.cmake" ] || [ -f "$INSTALL/lib64/cmake/SDL3/SDL3Config.cmake" ]; then
            echo "SDL3 already built (has SDL3Config.cmake)."
            exit 0
          fi

          rm -rf "$INSTALL"
          mkdir -p sdl3
          cd sdl3

          if [ ! -d "$SDL" ]; then
            curl -L -O "https://libsdl.org/release/$SDL.tar.gz"
            tar xf "$SDL.tar.gz"
          fi

          cd "$SDL"
          mkdir -p build
          cd build

          export PKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1

          pkg-config --version
          pkg-config --exists wayland-client
          pkg-config --exists wayland-egl

          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/aarch64-linux-gnu.cmake" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL_STATIC=OFF \
            -DSDL_WAYLAND=ON \
            -DSDL_WAYLAND_SHARED=ON \
            -DSDL_KMSDRM=OFF \
            -DSDL_KMSDRM_SHARED=OFF \
            -DSDL_X11=OFF \
            -DSDL_X11_SHARED=OFF \
            -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config

          cmake --build . --parallel
          cmake --install .

      - name: Build SDL_net (SDL3_net) from git (aarch64)
        shell: bash
        run: |
          set -euxo pipefail
          TP="$GITHUB_WORKSPACE/third_party"
          cd "$TP"

          INSTALL="$TP/sdl_net/build"
          SRC="$TP/sdl_net-src"

          if [ -f "$INSTALL/include/SDL3_net/SDL_net.h" ] && \
             ( [ -f "$INSTALL/lib/libSDL3_net.so" ] || [ -f "$INSTALL/lib64/libSDL3_net.so" ] ); then
            echo "SDL_net already built."
            exit 0
          fi

          SDL3_DIR="$(find "$TP/sdl3/build" -name SDL3Config.cmake -printf '%h\n' | head -n 1)"
          test -n "$SDL3_DIR"

          rm -rf "$INSTALL" "$SRC"
          git clone --depth 1 https://github.com/libsdl-org/SDL_net.git "$SRC"
          cd "$SRC"
          mkdir -p build
          cd build

          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/aarch64-linux-gnu.cmake" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL3_DIR="$SDL3_DIR"

          cmake --build . --parallel
          cmake --install .

      - name: Build 3sx (Linux ARM64)
        shell: bash
        run: |
          set -euxo pipefail

          LIBCDIO_PREFIX="$GITHUB_WORKSPACE/third_party/libcdio/build"
          LIBCDIO_PC="$LIBCDIO_PREFIX/lib/pkgconfig"

          PKG_CONFIG_PATH="$LIBCDIO_PC:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" \
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
          cmake -S . -B build-linux-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_WERROR=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/aarch64-linux-gnu.cmake" \
            -DCMAKE_PREFIX_PATH="$LIBCDIO_PREFIX" \
            -DCMAKE_LIBRARY_PATH="$LIBCDIO_PREFIX/lib" \
            -DCMAKE_INCLUDE_PATH="$LIBCDIO_PREFIX/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath,'\$ORIGIN/../lib' -static-libstdc++ -static-libgcc -L$LIBCDIO_PREFIX/lib"

          cmake --build build-linux-arm64 --parallel 2>&1 | tee build.log

      - name: Verify architecture
        shell: bash
        run: |
          set -euxo pipefail
          file build-linux-arm64/3sx | grep -q aarch64

      - name: Package ARM64 build (portable)
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist/bin dist/lib

          cp build-linux-arm64/3sx dist/bin/3sx
          chmod +x dist/bin/3sx

          if [ -d third_party/sdl3/build/lib64 ]; then
            SDL_LIBDIR="third_party/sdl3/build/lib64"
          else
            SDL_LIBDIR="third_party/sdl3/build/lib"
          fi

          FF_LIBDIR="third_party/ffmpeg/build/lib"

          if [ -d third_party/sdl_net/build/lib64 ]; then
            SDLNET_LIBDIR="third_party/sdl_net/build/lib64"
          else
            SDLNET_LIBDIR="third_party/sdl_net/build/lib"
          fi

          pick_latest() { ls -1 $1 2>/dev/null | sort -V | tail -n 1; }

          SDL_REAL="$(pick_latest "$SDL_LIBDIR/libSDL3.so.0.*")"
          AVCODEC_REAL="$(pick_latest "$FF_LIBDIR/libavcodec.so.62.*")"
          AVFORMAT_REAL="$(pick_latest "$FF_LIBDIR/libavformat.so.62.*")"
          AVUTIL_REAL="$(pick_latest "$FF_LIBDIR/libavutil.so.60.*")"
          SWR_REAL="$(pick_latest "$FF_LIBDIR/libswresample.so.6.*")"

          SDLNET_REAL="$(pick_latest "$SDLNET_LIBDIR/libSDL3_net.so.0.*")"
          if [ -z "${SDLNET_REAL:-}" ]; then
            SDLNET_REAL="$(pick_latest "$SDLNET_LIBDIR/libSDL3_net.so")"
          fi

          test -n "$SDL_REAL"
          test -n "$AVCODEC_REAL"
          test -n "$AVFORMAT_REAL"
          test -n "$AVUTIL_REAL"
          test -n "$SWR_REAL"
          test -n "${SDLNET_REAL:-}"

          cp -L "$SDL_REAL"      "dist/lib/$(basename "$SDL_REAL")"
          cp -L "$AVCODEC_REAL"  "dist/lib/$(basename "$AVCODEC_REAL")"
          cp -L "$AVFORMAT_REAL" "dist/lib/$(basename "$AVFORMAT_REAL")"
          cp -L "$AVUTIL_REAL"   "dist/lib/$(basename "$AVUTIL_REAL")"
          cp -L "$SWR_REAL"      "dist/lib/$(basename "$SWR_REAL")"
          cp -L "$SDLNET_REAL"   "dist/lib/$(basename "$SDLNET_REAL")"

          SDL_BASE="$(basename "$SDL_REAL")"
          AVCODEC_BASE="$(basename "$AVCODEC_REAL")"
          AVFORMAT_BASE="$(basename "$AVFORMAT_REAL")"
          AVUTIL_BASE="$(basename "$AVUTIL_REAL")"
          SWR_BASE="$(basename "$SWR_REAL")"
          SDLNET_BASE="$(basename "$SDLNET_REAL")"

          cp "dist/lib/$SDL_BASE"      dist/lib/libSDL3.so.0
          cp "dist/lib/$SDL_BASE"      dist/lib/libSDL3.so

          cp "dist/lib/$AVCODEC_BASE"  dist/lib/libavcodec.so.62
          cp "dist/lib/$AVCODEC_BASE"  dist/lib/libavcodec.so

          cp "dist/lib/$AVFORMAT_BASE" dist/lib/libavformat.so.62
          cp "dist/lib/$AVFORMAT_BASE" dist/lib/libavformat.so

          cp "dist/lib/$AVUTIL_BASE"   dist/lib/libavutil.so.60
          cp "dist/lib/$AVUTIL_BASE"   dist/lib/libavutil.so

          cp "dist/lib/$SWR_BASE"      dist/lib/libswresample.so.6
          cp "dist/lib/$SWR_BASE"      dist/lib/libswresample.so

          cp "dist/lib/$SDLNET_BASE"   dist/lib/libSDL3_net.so.0 || true
          cp "dist/lib/$SDLNET_BASE"   dist/lib/libSDL3_net.so   || true

          cat > dist/3sx.sh <<'SH'
          #!/bin/sh
          PORTDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$PORTDIR/lib:$LD_LIBRARY_PATH"
          exec "$PORTDIR/bin/3sx" "$@"
          SH
          chmod +x dist/3sx.sh

          tar -C dist -czf 3sx-linux-arm64.tar.gz .

      - name: Check required GLIBC symbols (dist)
        shell: bash
        run: |
          set -euxo pipefail

          echo "---- dist/bin/3sx max GLIBC ----"
          readelf --version-info dist/bin/3sx 2>/dev/null | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -V | tail -n 10 || true

          echo "---- dist/lib max GLIBC (each) ----"
          for f in dist/lib/*.so*; do
            [ -e "$f" ] || continue
            echo "== $f =="
            readelf --version-info "$f" 2>/dev/null | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -V | tail -n 5 || true
          done

      - name: Fail if package requires GLIBC > 2.32 (stock OS gate)
        shell: bash
        run: |
          set -euxo pipefail
          echo "Checking dist/ for GLIBC requirements (must be <= 2.32)..."
          max_ok="GLIBC_2.32"

          check_file() {
            f="$1"
            req="$(
              readelf --version-info "$f" 2>/dev/null \
                | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' \
                | sort -V | tail -n 1 || true
            )"
            echo "$f -> ${req:-none}"
            if [ -n "$req" ]; then
              top="$(printf '%s\n' "$max_ok" "$req" | sort -V | tail -n 1)"
              if [ "$top" != "$max_ok" ]; then
                echo "ERROR: $f requires $req > $max_ok"
                exit 1
              fi
            fi
          }

          check_file dist/bin/3sx
          for f in dist/lib/*.so*; do
            [ -e "$f" ] || continue
            check_file "$f"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-arm64
          path: build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3sx-linux-arm64
          path: 3sx-linux-arm64.tar.gz
